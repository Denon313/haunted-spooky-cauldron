<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>River</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------------- setup ----------------
const RW = 288, RH = 216;       // pixel-art resolution (scaled up by CSS)
const HOR = 110;                // far shore / horizon line
const MX = 214, MY = 40;        // moon
const canvas = document.getElementById("c");
canvas.width = RW; canvas.height = RH;
const ctx = canvas.getContext("2d");
const img = ctx.createImageData(RW, RH);
const D = img.data;

// ---------------- helpers ----------------
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const frac = v => v - Math.floor(v);
const hash = (x, y) => frac(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453);
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

// ---------------- tileable fog texture ----------------
const FW = 256, FH = 64;
const FOG = new Float32Array(FW * FH);
(function () {
  const rnd = mulberry32(21);
  function layer(gw, gh, amp) {
    const g = new Float32Array(gw * gh);
    for (let i = 0; i < g.length; i++) g[i] = rnd();
    for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) {
      const u = x / FW * gw, v = y / FH * gh;
      const x0 = Math.floor(u), y0 = Math.floor(v);
      const fx = u - x0, fy = v - y0;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const a = g[(y0 % gh) * gw + (x0 % gw)], b = g[(y0 % gh) * gw + ((x0 + 1) % gw)];
      const c = g[((y0 + 1) % gh) * gw + (x0 % gw)], d = g[((y0 + 1) % gh) * gw + ((x0 + 1) % gw)];
      const top = a + (b - a) * sx, bot = c + (d - c) * sx;
      FOG[y * FW + x] += amp * (top + (bot - top) * sy);
    }
  }
  layer(8, 4, 0.55); layer(16, 8, 0.30); layer(32, 16, 0.15);
})();
function fogAt(u, v) {
  u = ((u % FW) + FW) % FW; v = ((v % FH) + FH) % FH;
  const x0 = Math.floor(u), y0 = Math.floor(v);
  const fx = u - x0, fy = v - y0;
  const x1 = (x0 + 1) % FW, y1 = (y0 + 1) % FH;
  const a = FOG[y0 * FW + x0], b = FOG[y0 * FW + x1], c = FOG[y1 * FW + x0], d = FOG[y1 * FW + x1];
  const top = a + (b - a) * fx, bot = c + (d - c) * fx;
  return top + (bot - top) * fy;
}

// ---------------- terrain ----------------
const TREE = new Float32Array(RW), REED = new Float32Array(RW), BANK = new Float32Array(RW);
for (let x = 0; x < RW; x++) {
  const spike = Math.pow(1 - Math.abs(((x * 0.11) % 1) * 2 - 1), 1.4);
  const hill = 0.5 + 0.5 * Math.sin(x * 0.021 + 1.3) * Math.sin(x * 0.047 + 0.4);
  TREE[x] = HOR - 9 - 8 * hill - 9 * spike * (0.4 + 0.6 * hill);
  const r = hash(x, 3.1), cl = fogAt(x * 3, 5);
  REED[x] = ((x < 46 || x > 236) && r > 0.5 && cl > 0.4) ? 8 + r * 20 : 0;
  BANK[x] = 176 + 3 * Math.sin(x * 0.04) + (x < 40 ? (40 - x) * 0.1 : 0);
}

// ---------------- the figure ----------------
const CX = 112, HT = 124;
function seg(x, y, x1, y1, x2, y2, r) {
  const dx = x2 - x1, dy = y2 - y1;
  const t = clamp(((x - x1) * dx + (y - y1) * dy) / (dx * dx + dy * dy), 0, 1);
  const px = x1 + dx * t - x, py = y1 + dy * t - y;
  return px * px + py * py < r * r;
}
function figId(px, py, sw) {            // 0 none, 1 coat, 2 hat, 3 ruff, 4 glove, 5 pompom, 6 face, 7 nose, 8 wig, 9 eye, 10 grin
  const x = px - CX - sw, y = py;
  if (y >= 102 && y <= 128) {                           // tall cone hat with a brim
    const u = Math.min((y - 103) / 24, 1);
    const ox = -3 * Math.pow(Math.max(0, 1 - u), 1.5);
    let hw = y < 103 ? 0 : 9 * Math.pow(u, 0.9) + 0.5;
    if (y >= 125) hw = 10.5;
    if (Math.abs(x - ox) < hw) return 2;
  }
  if (Math.hypot(x + 3, y - 101) < 3.2) return 5;       // pompom on the hat
  if (Math.hypot(x - 31, y - (HT + 21)) < 3.3) return 4;   // glove (raised hand)
  if (Math.hypot(x + 24, y - (HT + 52)) < 3.3) return 4;   // glove (hanging hand)
  { const ex = x / 15, ey = (y - 146.5) / 4.5; if (ex * ex + ey * ey < 1) return 3; }   // ruffled collar
  // head turned in profile, looking toward the river
  if (Math.hypot(x - 11.5, y - 136.5) < 3.6) return 7;                 // big round red nose
  if (Math.hypot((x - 5) * 0.85, (y - 131.5) * 1.25) < 2.9) return 9;            // dark eye socket
  if (x > 0 && x < 10.5 && Math.abs(y - (142.2 - 0.09 * (x - 5.5) * (x - 5.5))) < 1.4 && Math.hypot(x, y - 135) < 10.4) return 10;   // painted grin
  if (Math.hypot(x, y - 135) < 10) return x > -2 ? 6 : 8;              // white face / back of head
  if (Math.hypot(x + 9, y - 131) < 5.5 || Math.hypot(x + 11, y - 139) < 5 || Math.hypot(x + 6, y - 126) < 4.5) return 8;   // curly wig
  if (y >= HT + 20 && y <= 186) {                       // baggy coat
    const u = (y - (HT + 20)) / (186 - (HT + 20));
    const hw = u < 0.18 ? 8 + Math.pow(u / 0.18, 0.6) * 11 : 19 + (u - 0.18) * 9.5;
    if (Math.abs(x) < hw) return 1;
  }
  if (seg(x, y, 16, HT + 33, 30, HT + 22, 4.2)) return 1;     // raised sleeve
  if (seg(x, y, -18, HT + 33, -24, HT + 52, 4)) return 1;     // hanging sleeve
  return 0;
}

// ---------------- eyes on the far shore ----------------
const EYE_X = [58, 236, 170];

// ---------------- render ----------------
function render(t, fr) {
  const sw = Math.sin(t * 0.5) * 0.6;
  const balX = 139 + Math.sin(t * 0.8) * 2.5 + sw, balY = 96 + Math.sin(t * 1.1) * 1.5;
  const handX = CX + sw + 31, handY = HT + 22;
  const knotY = balY + 12;

  const cyc = t % 22, eyeA = ss(9, 10.5, cyc) * (1 - ss(17.5, 19, cyc));
  const eyePos = Math.floor(t / 22) % 3;
  const EX = EYE_X[eyePos], EY = Math.min(TREE[EX] + 6, HOR - 3);
  const blinkOpen = (frac(t / 3.1) > 0.04) ? 1 : 0;

  for (let y = 0; y < RH; y++) {
    for (let x = 0; x < RW; x++) {
      let r, g, b;
      const bank = BANK[x];
      const dBal = Math.hypot(x - balX, y - balY);

      if (y < HOR) {
        // ----- sky -----
        const p = (y / HOR) * (y / HOR);
        r = 5 + 20 * p; g = 8 + 28 * p; b = 18 + 42 * p;
        const dm = Math.hypot(x - MX, y - MY);
        const halo = Math.exp(-dm * dm / 900) * 0.55 + Math.exp(-dm * dm / 90) * 0.35;
        r += 110 * halo; g += 125 * halo; b += 150 * halo;
        const cl = fogAt(x * 0.5 + t * 0.8 + 90, y * 1.4 + 10);
        const cloud = ss(0.52, 0.78, cl);
        r += cloud * 20; g += cloud * 26; b += cloud * 40;
        if (dm < 13) {
          const crater = fogAt(x * 4, y * 4 + 20);
          const sh = (0.82 + 0.35 * (crater - 0.5)) * (1 - 0.6 * cloud);
          r = 226 * sh; g = 228 * sh; b = 214 * sh;
        } else {
          const s = hash(x, y);
          if (s > 0.9968) {
            const tw = 0.5 + 0.5 * Math.sin(t * 2 + s * 400);
            const val = (90 + 120 * tw) * (1 - cloud) * (1 - y / HOR * 0.8);
            r += val; g += val; b += val;
          }
        }
        if (y >= TREE[x]) {                                   // far treeline
          const edge = y < TREE[x] + 1;
          r = edge ? 10 : 3; g = edge ? 16 : 6; b = edge ? 24 : 9;
        }
      } else if (y < bank) {
        // ----- river -----
        const dy = y - HOR, p = dy / (RH - HOR);
        const k0 = Math.exp(-dy / 18);
        r = (4 + 16 * k0) * (1 - 0.5 * p); g = (9 + 22 * k0) * (1 - 0.5 * p); b = (15 + 34 * k0) * (1 - 0.5 * p);
        const ln = Math.sin(dy * (1.6 + dy * 0.02) - t * 0.9 + Math.sin(x * 0.06 + dy * 0.2 + t * 0.3) * 2.2);
        const spread = 5 + dy * 0.32, wob = Math.sin(dy * 0.45 + t * 1.1) * (1.5 + dy * 0.06);
        const dxm = Math.abs(x - (MX + wob));
        if (ln > 0.55 && dxm < spread) {
          const k = (1 - dxm / spread) * (ln - 0.55) / 0.45 * Math.exp(-dy / 70);
          r += 150 * k; g += 160 * k; b += 178 * k;
        }
        const soft = Math.exp(-dxm * dxm / (spread * spread * 1.3)) * Math.exp(-dy / 55) * 0.22;
        r += 60 * soft; g += 66 * soft; b += 78 * soft;
        const dxb = Math.abs(x - (balX + wob * 0.4)), sb = 4 + dy * 0.12;
        if (ln > 0.35 && dxb < sb) {
          const k = (1 - dxb / sb) * (ln - 0.35) / 0.65 * 0.55 * Math.exp(-dy / 45);
          r += 190 * k; g += 12 * k; b += 14 * k;
        }
      } else {
        // ----- near bank -----
        const tuft = y < bank + 4 && hash(x, y) > 0.45;
        r = tuft ? 11 : 5; g = tuft ? 18 : 8; b = tuft ? 11 : 6;
      }
      if (REED[x] > 0 && y > bank - REED[x] && y <= bank + 1) { r = 2; g = 4; b = 3; }

      // ----- fog behind the figure -----
      {
        const f1 = fogAt(x * 0.7 + t * 2.5, y * 2.0 + 7);
        const band = Math.exp(-((y - (HOR + 6)) * (y - (HOR + 6))) / (2 * 22 * 22));
        const a = ss(0.35, 0.85, f1) * band * 0.62 + 0.10 * band;
        const redTint = Math.exp(-dBal * dBal / 1800) * 0.35;
        r += (46 + 150 * redTint - r) * a; g += (58 + 6 * redTint - g) * a; b += (76 + 8 * redTint - b) * a;
      }

      // ----- red glow of the balloon on everything near it -----
      {
        const gl = Math.exp(-dBal * dBal / 784) * 0.22;
        r += 170 * gl; g += 8 * gl; b += 10 * gl;
      }

      // ----- string -----
      if (y > knotY && y < handY) {
        const u = (y - knotY) / (handY - knotY);
        const sx = balX + (handX - balX) * u + Math.sin(u * 6.28 + t * 1.3) * 2 * (1 - u);
        if (Math.abs(x - sx) < 0.6) { r = 120; g = 108; b = 100; }
      }

      // ----- balloon -----
      {
        const nx = (x - balX) / 10, ny = (y - balY) / 12, r2 = nx * nx + ny * ny;
        if (r2 < 1) {
          const nz = Math.sqrt(1 - r2);
          const dot = clamp(nx * 0.55 + ny * -0.5 + nz * 0.67, 0, 1);
          const spec = Math.pow(dot, 22) * 0.55;
          let br = 55 + 190 * dot, bg = 4 + 22 * dot, bb = 6 + 26 * dot;
          br += 255 * spec; bg += 255 * spec; bb += 255 * spec;
          const fa = 0.18;                                       // thin fog over it
          r = br + (46 - br) * fa; g = bg + (58 - bg) * fa; b = bb + (76 - bb) * fa;
        } else if (y > balY + 11 && y < knotY + 2 && Math.abs(x - balX) < (y - (balY + 10)) * 0.9 && Math.abs(x - balX) < 2.5) {
          r = 90; g = 6; b = 8;                                  // knot
        }
      }

      // ----- the figure -----
      const fid = figId(x, y, sw);
      if (fid > 0) {
        const kB = Math.max(0, 1 - dBal / 70), lx = x - CX - sw;
        if (fid === 1) {
          r = 3; g = 4; b = 6;
          if (y > 150) {                                         // polka dots on the coat
            const gx = (lx + 60) % 9, gy = y % 9;
            if ((gx - 4.5) * (gx - 4.5) + (gy - 4.5) * (gy - 4.5) < 2.6) { r = 15; g = 20; b = 34; }
          }
          r += 24 * kB; g += kB;
        } else if (fid === 2) {
          const band = (Math.floor((y - 103) / 4) & 1);
          r = band ? 20 : 9; g = band ? 9 : 6; b = band ? 15 : 14; r += 40 * kB;
        } else if (fid === 5) {
          r = 34 + 90 * kB; g = 32 + 6 * kB; b = 38 + 6 * kB;
        } else if (fid === 3) {
          const m = Math.sin(lx * 1.4) * 12, mo = lx > 0 ? 14 : 0;
          r = 44 + m + mo + 110 * kB; g = 48 + m + mo + 8 * kB; b = 60 + m + mo + 8 * kB;
        } else if (fid === 6) {
          const sh = 0.5 + 0.32 * clamp((lx + 2) / 12, 0, 1);
          r = (150 + 95 * kB) * sh; g = (154 + 8 * kB) * sh; b = (170 + 8 * kB) * sh;
        } else if (fid === 7) {
          r = 205 + (lx > 12 && y < 136 ? 40 : 0); g = 14 + (lx > 12 && y < 136 ? 30 : 0); b = 20 + (lx > 12 && y < 136 ? 30 : 0);
        } else if (fid === 8) {
          const m = hash(x, y) * 10;
          r = 24 + m + 40 * kB; g = 16 + m * 0.6; b = 40 + m;
        } else if (fid === 9) {
          r = 2; g = 2; b = 4;
          if ((lx - 5) * (lx - 5) + (y - 131.5) * (y - 131.5) < 0.9) { r = 255; g = 225; b = 110; }
        } else if (fid === 10) {
          r = 205; g = 18; b = 24;
        } else {
          const dm = lx < 0 ? 0.5 : 1;
          r = (120 + 110 * kB) * dm; g = (124 + 12 * kB) * dm; b = (136 + 10 * kB) * dm;
        }
        const rim = figId(x + 1.5, y, sw) === 0 || figId(x + 1, y - 1, sw) === 0;
        if (rim && y < 176 && (fid === 1 || fid === 2 || fid === 3 || fid === 5 || fid === 8)) {
          r = 52 + 190 * kB * 0.6; g = 60 + 10 * kB; b = 78 + 10 * kB;
        }
      }

      // ----- low mist over the foreground -----
      {
        const f2 = fogAt(x * 0.5 - t * 3 + 40, y * 1.3 + 30);
        const a = ss(0.4, 0.9, f2) * ss(150, 190, y) * 0.5;
        r += (34 - r) * a; g += (42 - g) * a; b += (54 - b) * a;
      }

      // ----- eyes watching from the trees -----
      if (eyeA > 0.01) {
        for (let s = -1; s <= 1; s += 2) {
          const ex = (x - (EX + s * 5)) / 2.4, ey = (y - EY) / 1.4;
          if (blinkOpen && ex * ex + ey * ey < 1) {
            r = Math.max(r, 255 * eyeA); g = Math.max(g, 230 * eyeA); b = Math.max(b, 110 * eyeA);
          }
        }
        const h = Math.exp(-((x - EX) * (x - EX)) / 80 - ((y - EY) * (y - EY)) / 14) * 0.18 * eyeA * blinkOpen;
        r += 255 * h; g += 235 * h; b += 120 * h;
      }

      // ----- vignette, film grain, dithered palette -----
      const vx = x / RW - 0.5, vy = y / RH - 0.5;
      const vig = clamp(1 - 0.55 * (vx * vx * 1.6 + vy * vy * 1.4) * 2, 0.35, 1);
      const gr = (hash(x + (fr % 7) * 17.3, y * 1.3 + fr) - 0.5) * 6;
      const bay = BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.5;
      const LV = 12;
      const o = (y * RW + x) * 4;
      const cr = Math.pow(clamp((r * vig + gr) / 255, 0, 1), 0.85) * LV;
      const cg = Math.pow(clamp((g * vig + gr) / 255, 0, 1), 0.85) * LV;
      const cb = Math.pow(clamp((b * vig + gr) / 255, 0, 1), 0.85) * LV;
      D[o]     = Math.floor(clamp(cr + bay + 0.5, 0, LV)) / LV * 255;
      D[o + 1] = Math.floor(clamp(cg + bay + 0.5, 0, LV)) / LV * 255;
      D[o + 2] = Math.floor(clamp(cb + bay + 0.5, 0, LV)) / LV * 255;
      D[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

let last = 0, frameNo = 0;
const start = performance.now();
function loop(now) {
  if (now - last > 41) {                    // ~24 fps, like old pixel animation
    last = now;
    render((now - start) / 1000, frameNo++);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
